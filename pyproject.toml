[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robinhood-copy-backtest"
version = "0.1.0"
description = "Deterministic Robinhood Chain wallet copy-trading backtest engine"
requires-python = ">=3.11"

[project.scripts]
robin-copy-backtest = "copybot.cli:main"

[tool.setuptools.packages.find]
include = ["copybot*"]

