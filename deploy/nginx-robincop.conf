# Public application port. The web container itself remains bound to localhost
# on 8224 so all external traffic passes through these access rules.
server {
    listen 8222;
    server_name _;

    location ^~ /admin {
        return 308 https://robincop.com:8223$request_uri;
    }

    location ^~ /robincop-api/ {
        rewrite ^/robincop-api(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8883;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /robincop-api;
        proxy_read_timeout 600s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8224;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_connect_timeout 30s;
    }
}

# The admin surface is encrypted and protected with HTTP Basic authentication.
# Its API key is held in a root-only Nginx snippet on the server.
server {
    listen 8223 ssl;
    server_name robincop.com www.robincop.com;

    # Browsers treat a bare host:port entry as HTTP. Redirect that Nginx 497
    # case to the certificate-valid HTTPS hostname instead of showing a 400.
    error_page 497 =308 https://robincop.com:8223$request_uri;

    ssl_certificate /etc/letsencrypt/live/robincop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/robincop.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "RobinCop Admin";
    auth_basic_user_file /etc/nginx/.htpasswd-robincop;

    location = / {
        return 302 /admin;
    }

    location ^~ /robincop-api/ {
        rewrite ^/robincop-api(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8883;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /robincop-api;
        include /etc/nginx/snippets/robincop-admin-key.conf;
        proxy_read_timeout 600s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8224;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_connect_timeout 30s;
    }
}

# RobinCop.com terminates HTTPS here and forwards the public site to port 8222.
server {
    listen 443 ssl;
    server_name robincop.com www.robincop.com;

    ssl_certificate /etc/letsencrypt/live/robincop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/robincop.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8222;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_connect_timeout 30s;
    }
}

server {
    listen 80;
    server_name robincop.com www.robincop.com;
    return 301 https://$host$request_uri;
}
